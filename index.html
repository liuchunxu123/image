```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image</title>

    <!-- 微信等平台的链接预览图片 -->
    <meta property="og:title" content="Image">
    <meta property="og:description" content="">
    <meta property="og:image" content="https://liuchunxu123.github.io/image/A.png">
    <meta property="og:url" content="https://liuchunxu123.github.io/image/">
    <meta property="og:type" content="website">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        img {
            display: block;
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>

<body>

<img id="currentImage" alt="Image">

<script>
    /*
     * 当前显示的图片
     *
     * 第一次测试：
     * A.png
     *
     * 以后切换成 B：
     * B.jpg
     */
    const CURRENT_IMAGE = "A.png";

    const image = document.getElementById("currentImage");

    // 加时间戳，避免浏览器继续使用旧缓存
    image.src = CURRENT_IMAGE + "?v=" + Date.now();
</script>

</body>
</html>
```
