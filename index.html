```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image</title>

    <!-- 微信/社交平台链接预览 -->
    <meta property="og:title" content="Image">
    <meta property="og:description" content="">
    <meta property="og:image" content="https://liuchunxu123.github.io/image/A.png">
    <meta property="og:url" content="https://liuchunxu123.github.io/image/">
    <meta property="og:type" content="website">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        img {
            display: block;
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>

<body>

<img id="currentImage" alt="Image">

<script>
    const image = document.getElementById("currentImage");

    // 每次打开网页都重新请求 current.jpg
    // 避免浏览器一直使用旧缓存
    image.src = "./current.jpg?v=" + Date.now();
</script>

</body>
</html>
